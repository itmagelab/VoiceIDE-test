# =============================================================================
# manual-changelog.yml — example of a manually run GitHub Actions workflow
# =============================================================================
#
# Nothing in this file reacts to a push, a pull request or a schedule: the
# only trigger is `workflow_dispatch`, the one that starts a workflow by
# hand. It shows up as a "Run workflow" button on
#
#   https://github.com/<owner>/<repo>/actions/workflows/manual-changelog.yml
#
# and it can be started from a shell as well:
#
#   gh workflow run manual-changelog.yml --ref main
#   gh workflow run manual-changelog.yml --ref main \
#       -f range=v1.0.0..HEAD -f unreleased_only=true
#
# The run checks out the full history, installs git-cliff, renders a
# changelog with cliff.conf and leaves the result in three places: the job
# log, the run summary and a downloadable artifact.
#
# To reuse this for something else, keep the `on: workflow_dispatch` block
# and replace the steps.
# =============================================================================

name: Manual changelog (example)

# Shown in the "Actions" list instead of the workflow name — inputs can be
# used wherever an expression can.
run-name: "Changelog for ${{ inputs.range || 'the whole history' }}"

# -----------------------------------------------------------------------------
# Trigger — manual only
#
# `workflow_dispatch` is also the only trigger that can declare `inputs`;
# they become the form fields behind the "Run workflow" button. `type` is
# one of `string`, `boolean`, `choice` or `environment` (the last one needs
# a deployment environment configured in the repository settings).
#
# Other triggers (push, pull_request, schedule, release, ...) can be listed
# next to it and then start the workflow automatically as well.
# -----------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      # Text field: any git range ("v1.0.0..v1.2.3", "main", "HEAD~5..").
      # Empty means the whole history.
      range:
        description: "Commit range to cover (e.g. v1.0.0..HEAD). Empty = all history"
        type: string
        required: false
        default: ""

      # Checkbox: only render the commits newer than the newest tag.
      unreleased_only:
        description: "Only unreleased commits (since the last tag)"
        type: boolean
        required: false
        default: false

      # Dropdown: picked up by `runs-on` below, to show that inputs are not
      # limited to `run:` steps.
      runner:
        description: "Runner image to run on"
        type: choice
        required: false
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-22.04
          - macos-14

# -----------------------------------------------------------------------------
# Permissions — least privilege
#
# Narrowing the token means a bad input or a bug in this workflow cannot
# push, tag or release anything. Only add `contents: write` (or a
# job-level `permissions:` block) if a step really has to write back.
# -----------------------------------------------------------------------------
permissions:
  contents: read

# Manual runs are rare, so there is nothing to cancel — but keep two runs
# of the same branch from stacking up, and let `timeout-minutes` stop a
# forgotten one.
concurrency:
  group: manual-changelog-${{ github.ref }}
  cancel-in-progress: false

# Explicit shell: the script below uses bash arrays, so make the shell
# explicit instead of relying on the runner's default.
defaults:
  run:
    shell: bash

jobs:
  changelog:
    name: Generate a changelog with git-cliff
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10

    steps:
      # git-cliff reads the whole history *and* the tags, so the default
      # shallow checkout of a single commit is not enough.
      - name: Check out the repository (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Downloads a prebuilt git-cliff binary. Pin the version
      # (`tool: git-cliff@<version>`) for reproducible runs, or replace the
      # step with any other install method, e.g. the official action:
      #   - uses: orhunp/git-cliff-action@v4
      #     with:
      #       config: cliff.conf
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      # The inputs are passed through the environment rather than spliced
      # into the script: whatever sits inside `${{ }}` becomes literal text
      # in `run:`, so a range containing quotes or `$(...)` would otherwise
      # be executed by the shell.
      - name: Generate the changelog
        env:
          RANGE: ${{ inputs.range }}
          UNRELEASED_ONLY: ${{ inputs.unreleased_only }}
        run: |
          set -euo pipefail

          args=(--config cliff.conf)
          if [ "$UNRELEASED_ONLY" = "true" ]; then
            args+=(--unreleased)
          fi
          if [ -n "$RANGE" ]; then
            args+=("$RANGE")
          fi

          git cliff "${args[@]}" > CHANGELOG.md
          cat CHANGELOG.md

      # Whatever is appended to `$GITHUB_STEP_SUMMARY` shows up as markdown
      # on the run's summary page — a good place for the result of a
      # manual run.
      - name: Add the changelog to the run summary
        run: |
          {
            echo "## Changelog"
            echo
            cat CHANGELOG.md
          } >> "$GITHUB_STEP_SUMMARY"

      # Downloadable from the run page for a week ("Artifacts" at the
      # bottom). `if-no-files-found: error` makes a missing file fail the
      # step instead of silently uploading nothing.
      - name: Upload the changelog as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md
          retention-days: 7
          if-no-files-found: error
